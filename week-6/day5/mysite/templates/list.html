<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Blog | Django Routing Lab</title></head>
<body>
<nav><a href="{% url 'pages:home' %}">Home</a> | <a href="{% url 'pages:about' %}">About</a> | <a href="{% url 'pages:contact' %}">Contact</a> | <a href="{% url 'blog:list' %}">Blog</a></nav>
<h1>Blog posts</h1>
<ul>{% for post in posts %}<li><a href="{% url 'blog:detail' post.id %}"><strong>{{ post.title }}</strong></a> | <a href="{% url 'blog:category' post.category %}">{{ post.category }}</a><br>{{ post.summary }}</li>{% empty %}<li>No posts found.</li>{% endfor %}</ul>
</body>
</html>
