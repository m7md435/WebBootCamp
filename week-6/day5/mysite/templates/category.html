<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ category|title }} Posts | Django Routing Lab</title></head>
<body>
<nav><a href="{% url 'pages:home' %}">Home</a> | <a href="{% url 'pages:about' %}">About</a> | <a href="{% url 'pages:contact' %}">Contact</a> | <a href="{% url 'blog:list' %}">Blog</a></nav>
<h1>{{ category|title }} posts</h1>
{% if posts %}<ul>{% for post in posts %}<li><a href="{% url 'blog:detail' post.id %}">{{ post.title }}</a></li>{% endfor %}</ul>{% else %}<p>No posts exist in this category.</p>{% endif %}
<a href="{% url 'blog:list' %}">Back to all posts</a>
</body>
</html>
