<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ post.title }} | Django Routing Lab</title></head>
<body>
<nav><a href="{% url 'pages:home' %}">Home</a> | <a href="{% url 'pages:about' %}">About</a> | <a href="{% url 'pages:contact' %}">Contact</a> | <a href="{% url 'blog:list' %}">Blog</a></nav>
<h1>{{ post.title }}</h1>
<p><strong>Category:</strong> <a href="{% url 'blog:category' post.category %}">{{ post.category }}</a></p>
<p>{{ post.summary }}</p>
<a href="{% url 'blog:list' %}">Back to all posts</a>
</body>
</html>
