{% extends "library/base.html" %}

{% block title %}Books{% endblock %}

{% block content %}
<h2>All Books</h2>

{% for book in books %}
<div>
    <h3>{{ book.title }}</h3>
    <p>Author: {{ book.author }}</p>
    <p>{{ book.description }}</p>
    <p>Year: {{ book.year }}</p>
    <a href="{% url 'book_detail' book.id %}">Read More</a>
</div>
<hr>
{% endfor %}
{% endblock %}
